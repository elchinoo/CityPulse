[project]
name = "citypulse"
version = "0.1.0"
description = "A smart-city sensor platform on Postgres: a sensor simulator, an ingest gateway, a status engine and a burst button, built to be monitored by PagerLens."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "agentpg-kit>=0.2.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "opentelemetry-proto>=1.27",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
citypulse = "citypulse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citypulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

# Local development: use the sibling checkout of the kit. Images install the published kit instead (see Dockerfile).
[tool.uv.sources]
agentpg-kit = { path = "../agentpg-kit", editable = true }
